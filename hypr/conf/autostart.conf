#1. 환경변수 
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

#2. 포털 서비스
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal-kde
exec-once = sleep 1 && /usr/lib/xdg-desktop-portal

#3. 인증 서비스
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = sleep 1 && /usr/lib/pam_kwallet_init

#4. Applications
exec-once = mako
exec-once = udiskie
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = foot --server
exec-once = sleep 2 && kwalletd6
exec-once = kime
